name: deploy

# Push to main builds the site and publishes it. Two outputs, independently useful:
#   gh-pages  - the built _site, always (GitHub Pages, works with no configuration)
#   the host  - a signed POST to DEPLOY_WEBHOOK_URL, only when that secret exists
# Set DEPLOY_WEBHOOK_URL to a URL on the popopx.chat server that pulls gh-pages (or
# accepts the artifact) and reloads; see README.md "Automated updates".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write           # only consumed if Pages is enabled on the gh-pages branch
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci --prefix website

      - name: Build
        run: bash build.sh

      - name: Guard - the build must produce pages
        run: |
          n=$(find website/_site -name '*.html' | wc -l)
          echo "$n html pages"
          test "$n" -gt 200 || { echo "build produced too few pages"; exit 1; }
          # Link verification files must exist or mobile deep links silently stop working.
          test -s website/_site/.well-known/assetlinks.json
          test -s website/_site/.well-known/apple-app-site-association
          grep -q '"package_name": "com.popopxchat.popopx"' website/_site/.well-known/assetlinks.json
          grep -q 'PDBA6XRBQT.com.popopxchat.popopx' website/_site/.well-known/apple-app-site-association

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: website/_site
          retention-days: 7

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          # gh-pages is the branch the host pulls, so every push here must be a
          # fast-forward. Building a fresh root commit made the SECOND deploy fail
          # ("! [rejected] gh-pages (fetch first)") and left the published site on
          # the first one, silently. A force would publish, but would also break the
          # host's `git pull`. So: clone what is there, replace its contents, commit.
          dest=$(mktemp -d)
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null 2>&1; then
            git clone -q --single-branch --branch gh-pages "$url" "$dest"
          else
            git init -q "$dest"
            git -C "$dest" remote add origin "$url"
          fi
          git -C "$dest" config user.name "github-actions[bot]"
          git -C "$dest" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find "$dest" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a website/_site/. "$dest/"
          git -C "$dest" add -A
          if git -C "$dest" diff --cached --quiet; then
            echo "gh-pages already matches this build - nothing to publish"
            exit 0
          fi
          git -C "$dest" commit -q -m "Deploy ${SHA}"
          git -C "$dest" push -q origin HEAD:gh-pages

      - name: Notify the host
        env:
          URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        if: env.URL != ''
        run: |
          body="{\"ref\":\"main\",\"sha\":\"${SHA}\",\"run\":\"${RUN_ID}\"}"
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" -hex | awk '{print $2}')
          curl -sfS -X POST "$URL" -H "content-type: application/json" \
               -H "x-popopx-signature: sha256=${sig}" --data "$body"

      # A guard that is skipped is not a guard that passed: without this line a run
      # where the host was never told looks identical to one where it was.
      - name: Note an un-notified host
        env:
          URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        if: env.URL == ''
        run: |
          echo "::notice::DEPLOY_WEBHOOK_URL is not configured, so gh-pages was published but no host was told to pull it. On the server: cd <gh-pages checkout> && git pull && sudo systemctl start popopx-sync.service"
