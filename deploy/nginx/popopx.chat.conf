# /etc/nginx/conf.d/popopx.chat.conf   (CentOS / RHEL, nginx from EPEL)
server {
    listen 80;
    listen [::]:80;
    server_name popopx.chat www.popopx.chat;
    root /srv/popopx.chat;

    # Required: without an explicit JSON type, nginx serves the extensionless
    # AASA as application/octet-stream and iOS refuses to verify applinks.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }
    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    # A generic "deny dot-files" rule would break both of the above silently,
    # and the failure looks identical to a missing file (404). Keep it commented.
    # location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    # Certbot on EL7 writes to /.well-known/acme-challenge; do not shadow it.
    location ^~ /.well-known/acme-challenge/ { root /srv/popopx.chat; }
}
